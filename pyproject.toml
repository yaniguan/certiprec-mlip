[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "certiprec"
version = "0.1.0"
description = "Adaptive BF16xk precision and finite-set force certificates for equivariant MLIPs"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = ["torch>=2.0", "numpy", "matplotlib", "cuequivariance>=0.13,<0.14"]

[project.optional-dependencies]
test = ["pytest"]
reference = ["cuequivariance-torch>=0.13,<0.14"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
